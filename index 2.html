<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日いくら？">
<title>今日いくら？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px 35px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0}
button{font:inherit}.icon{border:0;background:#fff;border-radius:14px;padding:10px 12px;font-size:20px}
.date{text-align:center;color:#6b7280;font-size:14px;margin-bottom:15px}
.hero{background:#111827;color:#fff;border-radius:28px;padding:30px 18px 25px;text-align:center;box-shadow:0 12px 28px #0002}
.label{font-size:15px;opacity:.75}.amount{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:9px 0}.remainToday{font-size:15px;opacity:.82}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.card{background:#fff;border-radius:18px;padding:16px}.small{font-size:13px;color:#6b7280}.val{font-size:21px;font-weight:750;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:0;background:#fff;border-radius:16px;padding:16px;font-weight:700;box-shadow:0 2px 9px #0000000b}.actions .wide{grid-column:1/-1;background:#e5e7eb}
.actions .income{background:#eef2ff}.actions .expense{background:#fff}
section{margin-top:22px}h2{font-size:16px;margin:0 0 9px}.box{background:#fff;border-radius:18px;overflow:hidden}.row{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee}.row:last-child{border:0}.empty{text-align:center;color:#9ca3af;padding:22px}
.note{text-align:center;color:#9ca3af;font-size:12px;margin-top:18px}
dialog{border:0;border-radius:22px;width:min(92%,420px);padding:22px;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}
label{display:block;color:#6b7280;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:17px}
.btns{display:flex;gap:10px;margin-top:20px}.btns button{flex:1;padding:13px;border:0;border-radius:12px}.primary{background:#111827;color:#fff}
.secondary{background:#e5e7eb}.danger{color:#b91c1c;background:#fee2e2}
#receiptPreview{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#f3f4f6;margin-top:10px;display:none}
.ocrStatus{font-size:13px;color:#6b7280;margin-top:10px;min-height:20px}
.hint{font-size:12px;color:#9ca3af;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header><h1>今日いくら？</h1><button class="icon" onclick="settings.showModal()">⚙️</button></header>
<div id="date" class="date"></div>
<div class="hero">
 <div class="label">今日使える金額</div>
 <div id="today" class="amount">¥0</div>
 <div id="remainToday" class="remainToday"></div>
</div>
<div class="stats">
 <div class="card"><div class="small">今月の残り</div><div id="remain" class="val">¥0</div></div>
 <div class="card"><div class="small">今月の使用額</div><div id="spent" class="val">¥0</div></div>
</div>
<div class="actions">
 <button class="expense" onclick="expense.showModal()">− 支出</button>
 <button class="income" onclick="income.showModal()">＋ 臨時収入</button>
 <button class="wide" onclick="custom.showModal()">− 金額を入力</button>
</div>
<section><h2>今日の履歴</h2><div id="history" class="box"></div></section>
<div id="carry" class="note"></div>
</div>

<dialog id="settings">
<h2>設定</h2>
<label>月のお小遣い</label><input id="allowance" type="number" min="0" step="100" inputmode="numeric">
<label>毎月の支給日（1〜28日）</label><input id="startDay" type="number" min="1" max="28" inputmode="numeric">
<div class="btns"><button onclick="settings.close()">キャンセル</button><button class="primary" onclick="saveSettings()">保存</button></div>
</dialog>

<dialog id="expense">
<h2>支出</h2>
<label>金額</label><input id="expenseAmount" type="number" min="1" step="100" inputmode="numeric" placeholder="例：1280">
<div class="btns"><button onclick="expense.close()">キャンセル</button><button class="primary" onclick="saveExpense()">登録</button></div>
<div class="hint">レシートから読み取る場合は下の「レシート撮影」を使えます。</div>
<div class="btns"><button class="secondary" onclick="receipt.showModal();expense.close()">📷 レシート撮影</button></div>
</dialog>

<dialog id="custom">
<h2>支出</h2><label>金額</label><input id="customAmount" type="number" min="1" step="100" inputmode="numeric">
<div class="btns"><button onclick="custom.close()">キャンセル</button><button class="primary" onclick="saveCustom()">登録</button></div>
</dialog>

<dialog id="income">
<h2>臨時収入</h2>
<label>金額</label><input id="incomeAmount" type="number" min="1" step="100" inputmode="numeric" placeholder="例：5000">
<div class="btns"><button onclick="income.close()">キャンセル</button><button class="primary" onclick="saveIncome()">登録</button></div>
</dialog>

<dialog id="receipt">
<h2>レシート撮影</h2>
<label>レシートを撮影</label>
<input id="receiptFile" type="file" accept="image/*" capture="environment">
<img id="receiptPreview" alt="レシートプレビュー">
<div id="ocrStatus" class="ocrStatus"></div>
<label>読み取った金額（修正できます）</label>
<input id="receiptAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="読み取り後に表示">
<div class="btns"><button onclick="receipt.close()">キャンセル</button><button class="primary" onclick="saveReceipt()">支出として登録</button></div>
<div class="hint">※ レシートの印字状態によって読み取りを間違えることがあります。登録前に金額を確認してください。</div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY="todayikura_v3";
let data=JSON.parse(localStorage.getItem(KEY)||"null");
if(!data){
  const old=JSON.parse(localStorage.getItem("todayikura_v2")||"null");
  data=old||{allowance:25000,startDay:1,logs:[]};
  data.logs=(data.logs||[]).map(x=>({type:x.type||"expense",amount:Number(x.amount)||0,date:x.date}));
}
data.allowance=Number(data.allowance)||25000;
data.startDay=Number(data.startDay)||1;
data.logs=data.logs||[];

const yen=n=>"¥"+Math.max(0,Math.round(n)).toLocaleString("ja-JP");
const dayMs=86400000;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function startOfCycle(d=new Date()){
 let y=d.getFullYear(),m=d.getMonth();
 if(d.getDate()<data.startDay)m--;
 return new Date(y,m,data.startDay,0,0,0,0);
}
function endOfCycle(s){return new Date(s.getFullYear(),s.getMonth()+1,data.startDay,0,0,0,0)}
function logsIn(s,e){return data.logs.filter(x=>{let d=new Date(x.date);return d>=s&&d<e})}
function calc(){
 const now=new Date(), s=startOfCycle(now), e=endOfCycle(s);
 const logs=logsIn(s,e);
 const spent=logs.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0);
 const income=logs.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0);
 const remain=Math.max(0,data.allowance+income-spent);
 const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const todayLogs=logs.filter(x=>new Date(x.date)>=todayStart&&new Date(x.date)<new Date(todayStart.getTime()+dayMs));
 const todaySpent=todayLogs.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0);
 const daysLeft=Math.max(1,Math.ceil((e-now)/dayMs));
 const daily=Math.floor(remain/daysLeft);
 const available=Math.max(0,daily);
 document.getElementById("date").textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
 document.getElementById("today").textContent=yen(available);
 document.getElementById("remainToday").textContent=`今日すでに ${yen(todaySpent)} 使用`;
 document.getElementById("remain").textContent=yen(remain);
 document.getElementById("spent").textContent=yen(spent);
 document.getElementById("carry").textContent=`支給期間の残り ${daysLeft}日`;
 const h=document.getElementById("history");
 h.innerHTML=todayLogs.length?todayLogs.slice().reverse().map(x=>{
   const isIncome=x.type==="income";
   return `<div class="row"><span>${new Date(x.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})} ${isIncome?"臨時収入":"支出"}</span><strong>${isIncome?"+":"−"} ${yen(x.amount)}</strong></div>`;
 }).join(""):'<div class="empty">今日はまだ記録がありません</div>';
}
function addExpense(amount){amount=Number(amount);if(!(amount>0))return;data.logs.push({type:"expense",amount,date:new Date().toISOString()});save();calc()}
function addIncome(amount){amount=Number(amount);if(!(amount>0))return;data.logs.push({type:"income",amount,date:new Date().toISOString()});save();calc()}
function saveExpense(){const a=Number(document.getElementById("expenseAmount").value);if(a>0){addExpense(a);document.getElementById("expenseAmount").value="";expense.close()}}
function saveCustom(){const a=Number(document.getElementById("customAmount").value);if(a>0){addExpense(a);document.getElementById("customAmount").value="";custom.close()}}
function saveIncome(){const a=Number(document.getElementById("incomeAmount").value);if(a>0){addIncome(a);document.getElementById("incomeAmount").value="";income.close()}}
function saveSettings(){
 data.allowance=Math.max(0,Number(document.getElementById("allowance").value)||0);
 data.startDay=Math.min(28,Math.max(1,Number(document.getElementById("startDay").value)||1));
 save();settings.close();calc();
}
const receiptFile=document.getElementById("receiptFile");
receiptFile.addEventListener("change",async()=>{
 const file=receiptFile.files&&receiptFile.files[0]; if(!file)return;
 const preview=document.getElementById("receiptPreview"),status=document.getElementById("ocrStatus");
 preview.src=URL.createObjectURL(file);preview.style.display="block";
 status.textContent="レシートを読み取っています…";
 document.getElementById("receiptAmount").value="";
 try{
   const result=await Tesseract.recognize(file,"jpn+eng",{logger:m=>{
     if(m.status==="recognizing text"&&m.progress)status.textContent=`レシートを読み取り中… ${Math.round(m.progress*100)}%`;
   }});
   const text=result.data.text||"";
   const amount=extractReceiptTotal(text);
   if(amount){
     document.getElementById("receiptAmount").value=amount;
     status.textContent=`合計 ${yen(amount)} を読み取りました。金額を確認して登録してください。`;
   }else{
     status.textContent="合計金額を自動判定できませんでした。金額を入力してください。";
   }
 }catch(e){
   console.error(e);status.textContent="読み取りに失敗しました。金額を手入力してください。";
 }
});
function extractReceiptTotal(text){
 const normalized=text.replace(/[¥￥]/g,"円").replace(/[,\s]/g,"");
 const patterns=[
   /(?:合計|総合計|お買上(?:げ|げ)?合計|お会計|お支払(?:い|額)?|支払額|今回のお支払額)[^0-9]{0,20}([0-9]{1,7})円?/i,
   /(?:total|grandtotal|amountpaid)[^0-9]{0,20}([0-9]{1,7})/i
 ];
 for(const p of patterns){const m=normalized.match(p);if(m)return Number(m[1]);}
 const nums=[...normalized.matchAll(/([0-9]{1,7})円/g)].map(m=>Number(m[1])).filter(n=>n>0);
 return nums.length?Math.max(...nums):null;
}
function saveReceipt(){
 const a=Number(document.getElementById("receiptAmount").value);
 if(a>0){addExpense(a);document.getElementById("receiptFile").value="";document.getElementById("receiptPreview").style.display="none";document.getElementById("ocrStatus").textContent="";receipt.close()}
}
document.getElementById("allowance").value=data.allowance;
document.getElementById("startDay").value=data.startDay;
calc();
</script>
</body></html>
