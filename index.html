<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6">
<title>今日いくら？</title>
<style>
:root{--navy:#111827;--blue:#0785f5;--bg:#f3f4f6;--muted:#8f99a8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:760px;height:100dvh;margin:0 auto;padding:10px 14px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.header{height:43px;flex:0 0 43px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;line-height:1;font-weight:800;letter-spacing:-1px;margin:0}
.icon{width:43px;height:43px;border:0;border-radius:15px;background:#fff;font-size:22px;box-shadow:0 2px 7px #00000008}
.date{height:25px;flex:0 0 25px;text-align:center;color:#6d7787;font-size:16px;margin:0}
.hero{background:var(--navy);border-radius:27px;padding:25px 12px 19px;text-align:center;box-shadow:0 12px 26px #1118271c;flex:0 0 226px;min-height:0}
.heroLabel{color:#d1d5db;font-size:17px;margin-bottom:7px}
.today{font-size:58px;line-height:1;font-weight:800;letter-spacing:-3px;color:#fff;white-space:nowrap}
.alert{margin:12px auto 0;color:#ff1717;font-size:16px;font-weight:800;line-height:1.25;max-width:680px}
.tomorrow,.usedToday{color:#d1d5db;font-size:16px;line-height:1.35;margin-top:10px}
.notice{color:#d1d5db;font-size:12px;margin-top:5px;display:none}
.stats{height:76px;flex:0 0 76px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:21px;padding:12px 17px;box-shadow:0 2px 8px #00000008;display:flex;flex-direction:column;justify-content:center}
.stat span{display:block;color:#70798a;font-size:14px;margin-bottom:4px}
.stat b{font-size:26px;letter-spacing:-1px}
.actions{height:137px;flex:0 0 137px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:43px 43px 43px;gap:4px 10px}
.action{height:43px;border:0;border-radius:16px;background:#fff;color:var(--blue);font-size:17px;font-weight:700;box-shadow:0 2px 8px #00000008}
.action.income{background:#edf2ff}
.action.full{grid-column:1/-1;background:#e5e7eb}
#receiptFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.historyTitle{height:24px;flex:0 0 24px;font-size:19px;font-weight:800;margin:0}
.history{height:105px;flex:0 0 105px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.row{height:35px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-bottom:1px solid #e5e7eb;font-size:15px}
.row:last-child{border-bottom:0}.expense{font-weight:700}.incomeRow{font-weight:700;color:#147a37}
.empty{padding:12px 18px;color:#8b95a5;font-size:14px}
.period{text-align:center;color:#a0a9b8;font-size:14px;height:18px;flex:0 0 18px;margin:0}
dialog{border:0;border-radius:24px;width:min(92%,500px);padding:0;box-shadow:0 16px 60px #0005}
dialog::backdrop{background:#0008}
.modal{padding:24px}.modal h2{font-size:22px;margin:0 0 18px}.modal p{color:#667085;line-height:1.6}
.field{margin:15px 0}.field label{display:block;color:#667085;font-size:13px;margin-bottom:7px}
.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:13px;background:#fff}
.modalButtons{display:flex;gap:9px;margin-top:20px}.modalButtons button{flex:1;padding:12px;border:0;border-radius:13px}
.primary{background:var(--blue);color:#fff}.danger{background:#d00;color:#fff}
.resetArea{border-top:1px solid #e5e7eb;margin-top:22px;padding-top:18px}.resetTitle{font-size:12px;color:#98a2b3;margin-bottom:8px}
.resetButton{width:100%;padding:11px;border:1px solid #d00;color:#d00;background:#fff;border-radius:13px}
.quick{display:flex;gap:7px;margin-top:8px}.quick button{flex:1;padding:9px;border:1px solid #ddd;background:#fff;border-radius:11px}
.preview{width:100%;max-height:230px;object-fit:contain;border-radius:15px;background:#f2f4f7;margin-top:8px;display:none}
.ocrStatus{font-size:13px;color:#667085;line-height:1.5;margin-top:9px}
@media(max-height:760px){
 .app{padding-top:max(30px,calc(env(safe-area-inset-top) + 10px));padding-bottom:6px;gap:5px}
 .hero{flex-basis:198px;padding-top:19px;padding-bottom:14px}
 .today{font-size:51px}.alert{margin-top:8px;font-size:14px}.tomorrow,.usedToday{font-size:14px;margin-top:7px}
 .stats{flex-basis:68px;height:68px}.stat{padding:9px 15px}.stat b{font-size:23px}
 .actions{flex-basis:126px;height:126px;grid-template-rows:40px 40px 40px}.action{height:40px;font-size:16px}
 .historyTitle{font-size:18px}.history{height:90px;flex-basis:90px}.row{height:30px;font-size:14px}.period{font-size:13px}
}
@media(min-width:600px){
 .app{padding-left:24px;padding-right:24px}.hero{flex-basis:240px}.today{font-size:66px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>今日いくら？</h1><button class="icon" id="settingsBtn" aria-label="設定">⚙️</button></div>
  <div class="date" id="todayDate"></div>

  <section class="hero">
    <div class="heroLabel">今日使える金額</div>
    <div class="today" id="today">¥0</div>
    <div class="alert" id="alert"></div>
    <div class="tomorrow" id="tomorrow"></div>
    <div class="usedToday" id="usedToday"></div>
    <div class="notice" id="notice"></div>
  </section>

  <section class="stats">
    <div class="stat"><span>今月の残り</span><b id="remain">¥0</b></div>
    <div class="stat"><span>今月の使用額</span><b id="spent">¥0</b></div>
  </section>

  <section class="actions">
    <button class="action" id="expenseBtn">− 支出</button>
    <button class="action income" id="incomeBtn">＋ 臨時収入</button>
    <button class="action full" id="customBtn">− 金額を入力</button>
    <label class="action full" for="receiptFile" style="display:flex;align-items:center;justify-content:center;cursor:pointer">🧾 レシート（カメラ）</label>
    <input id="receiptFile" type="file" accept="image/*" capture="environment">
  </section>

  <h2 class="historyTitle">今日の履歴</h2>
  <div class="history" id="history"></div>
  <div class="period" id="period"></div>
</div>

<dialog id="settingsDialog"><div class="modal">
  <h2>設定</h2>
  <div class="field"><label>次回のお小遣い</label><input id="nextAllowance" type="number" min="0" step="100" placeholder="例：39000"></div>
  <div class="field"><label>お小遣い開始日</label><input id="startDay" type="number" min="1" max="28"></div>
  <div class="field"><label>月末の残り</label><select id="carryover"><option value="carry">次月へ繰り越す</option><option value="save">貯金として残す</option><option value="reset">リセットする</option></select></div>
  <div class="modalButtons"><button id="settingsCancel">キャンセル</button><button class="primary" id="settingsSave">保存</button></div>
  <div class="resetArea"><div class="resetTitle">危険な操作</div><button class="resetButton" id="resetBtn">⚠️ データをリセット</button></div>
</div></dialog>

<dialog id="resetDialog"><div class="modal">
  <h2>リセットしてもよろしいですか？</h2><p>支出・臨時収入・設定など、アプリ内の保存データを初期化します。</p>
  <div class="modalButtons"><button id="resetCancel">キャンセル</button><button class="danger" id="resetConfirm">リセット</button></div>
</div></dialog>

<dialog id="amountDialog"><div class="modal">
  <h2 id="amountTitle">支出</h2>
  <div class="field"><label>金額</label><input id="amountInput" type="number" min="1" inputmode="numeric" placeholder="500"></div>
  <div class="quick"><button data-quick="500">¥500</button><button data-quick="1000">¥1,000</button><button data-quick="3000">¥3,000</button></div>
  <div class="modalButtons"><button id="amountCancel">キャンセル</button><button class="primary" id="amountOK">登録</button></div>
</div></dialog>

<dialog id="ocrDialog"><div class="modal">
  <h2>レシート</h2>
  <img id="receiptPreview" class="preview" alt="レシート画像">
  <div class="ocrStatus" id="ocrStatus">レシートを読み取っています…</div>
  <div class="field"><label>読み取った金額（修正できます）</label><input id="ocrAmount" type="number" min="1" inputmode="numeric"></div>
  <div class="modalButtons"><button id="ocrCancel">キャンセル</button><button class="primary" id="ocrOK">支出として登録</button></div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY="todayIkura_v17";
const DEFAULT_REMAIN=17664, DEFAULT_NEXT=39000;
const data=load();

function load(){
  const base={startDay:1,carryoverMode:"carry",allowanceByCycle:{},openingBalanceByCycle:{},logs:[],dailyBudgetByDate:{}};
  try{
    const old=JSON.parse(localStorage.getItem(KEY)||"null");
    return old?Object.assign(base,old):base;
  }catch(e){return base}
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function yen(n){return (n<0?"−":"")+"¥"+Math.abs(Math.floor(n)).toLocaleString("ja-JP")}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function cycleStart(d){
  const day=Math.min(Math.max(1,Number(data.startDay)||1),28);
  return d.getDate()>=day?new Date(d.getFullYear(),d.getMonth(),day):new Date(d.getFullYear(),d.getMonth()-1,day);
}
function cycleEnd(s){return new Date(s.getFullYear(),s.getMonth()+1,s.getDate())}
function days(a,b){return Math.max(1,Math.round((b-a)/86400000))}
function logsBetween(a,b){return data.logs.filter(x=>{const d=new Date(x.date);return d>=a&&d<b})}
function sum(ls,type){return ls.filter(x=>x.type===type).reduce((n,x)=>n+x.amount,0)}

function cycleAllowance(s){
  const k=key(s);
  if(Number.isFinite(data.openingBalanceByCycle[k])) return data.openingBalanceByCycle[k];
  const own=Number(data.allowanceByCycle[k]);
  if(Number.isFinite(own)){
    if(data.carryoverMode!=="carry") return own;
    const prev=new Date(s.getFullYear(),s.getMonth()-1,s.getDate());
    const pk=key(prev), prevBase=Number(data.allowanceByCycle[pk]), prevOpen=Number(data.openingBalanceByCycle[pk]);
    if(!Number.isFinite(prevBase)&&!Number.isFinite(prevOpen))return own;
    const prevAllowance=Number.isFinite(prevOpen)?prevOpen:(Number.isFinite(prevBase)?prevBase:25000);
    const pl=logsBetween(prev,cycleEnd(prev));
    return own+Math.max(0,prevAllowance+sum(pl,"income")-sum(pl,"expense"));
  }
  return 25000;
}

function calc(){
  const now=new Date(), cs=cycleStart(now), ce=cycleEnd(cs), all=logsBetween(cs,ce);
  const spent=sum(all,"expense"), income=sum(all,"income");
  const remain=cycleAllowance(cs)+income-spent;
  const td=startOfDay(now), tomorrow=new Date(td.getTime()+86400000);
  const tl=logsBetween(td,tomorrow), ts=sum(tl,"expense"), ti=sum(tl,"income");
  const dk=key(now);
  let daily=Number(data.dailyBudgetByDate[dk]);
  if(!Number.isFinite(daily)){
    daily=Math.floor(Math.max(0,remain)/days(td,ce));
    data.dailyBudgetByDate[dk]=daily; save();
  }
  const todayRemain=daily-ts+ti;
  const tomorrowDaily=Math.floor(Math.max(0,remain)/days(tomorrow,ce));

  document.getElementById("todayDate").textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",weekday:"short"});
  document.getElementById("today").textContent=yen(todayRemain);
  document.getElementById("remain").textContent=yen(remain);
  document.getElementById("spent").textContent=yen(spent);
  document.getElementById("tomorrow").textContent="明日は "+yen(tomorrowDaily)+" 使える予定";
  document.getElementById("usedToday").textContent="今日すでに "+yen(ts)+" 使用";
  const alert=document.getElementById("alert");
  if(todayRemain<0){alert.style.display="block";alert.textContent="使いすぎです。明日以降は1日 "+yen(tomorrowDaily)+" になります."}
  else alert.style.display="none";

  const nk=key(new Date(ce.getFullYear(),ce.getMonth()+1,ce.getDate()));
  const next=data.allowanceByCycle[nk], notice=document.getElementById("notice");
  if(next!=null){notice.style.display="block";notice.textContent=(new Date(ce.getFullYear(),ce.getMonth()+1,ce.getDate()).getMonth()+1)+"月のお小遣い："+yen(next)}
  else notice.style.display="none";

  document.getElementById("period").textContent="支給期間の残り "+days(td,ce)+"日";
  renderHistory(tl);
}

function renderHistory(ls){
  const el=document.getElementById("history");
  if(!ls.length){el.innerHTML='<div class="empty">まだありません</div>';return}
  el.innerHTML=ls.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3).map(x=>{
    const sign=x.type==="income"?"+":"−", cls=x.type==="income"?"incomeRow":"expense";
    const t=new Date(x.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    return '<div class="row"><span>'+t+" "+esc(x.label)+'</span><span class="'+cls+'">'+sign+" "+yen(x.amount)+'</span></div>';
  }).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(type,amount,label){
  const n=Math.floor(Number(amount)); if(!Number.isFinite(n)||n<=0)return;
  data.logs.push({type,amount:n,label:label||"支出",date:new Date().toISOString()});
  save();calc();
}
function openAmount(type){
  window.amountType=type;
  document.getElementById("amountTitle").textContent=type==="expense"?"支出":"臨時収入";
  document.getElementById("amountInput").value="";
  document.getElementById("amountDialog").showModal();
}
function openSettings(){
  const cs=cycleStart(new Date()), ce=cycleEnd(cs), nk=key(new Date(ce.getFullYear(),ce.getMonth()+1,ce.getDate()));
  document.getElementById("nextAllowance").value=data.allowanceByCycle[nk]??"";
  document.getElementById("startDay").value=data.startDay;
  document.getElementById("carryover").value=data.carryoverMode;
  document.getElementById("settingsDialog").showModal();
}
function saveSettings(){
  const amount=Number(document.getElementById("nextAllowance").value), newStart=Number(document.getElementById("startDay").value);
  if(!Number.isInteger(newStart)||newStart<1||newStart>28){alert("開始日は1〜28で入力してください。");return}
  data.startDay=newStart; data.carryoverMode=document.getElementById("carryover").value;
  const cs=cycleStart(new Date()), nk=key(new Date(cs.getFullYear(),cs.getMonth()+1,cs.getDate()));
  if(Number.isFinite(amount)&&amount>=0)data.allowanceByCycle[nk]=amount;
  save();document.getElementById("settingsDialog").close();calc();
}
function resetAll(){
  localStorage.removeItem(KEY);
  data.startDay=1;data.carryoverMode="carry";data.allowanceByCycle={};data.openingBalanceByCycle={};data.logs=[];data.dailyBudgetByDate={};
  const now=new Date(),cs=cycleStart(now),ce=cycleEnd(cs);
  data.openingBalanceByCycle[key(cs)]=DEFAULT_REMAIN;
  data.allowanceByCycle[key(new Date(ce.getFullYear(),ce.getMonth()+1,ce.getDate()))]=DEFAULT_NEXT;
  save();document.getElementById("resetDialog").close();document.getElementById("settingsDialog").close();calc();
}

document.getElementById("settingsBtn").onclick=openSettings;
document.getElementById("settingsCancel").onclick=()=>document.getElementById("settingsDialog").close();
document.getElementById("settingsSave").onclick=saveSettings;
document.getElementById("resetBtn").onclick=()=>document.getElementById("resetDialog").showModal();
document.getElementById("resetCancel").onclick=()=>document.getElementById("resetDialog").close();
document.getElementById("resetConfirm").onclick=resetAll;
document.getElementById("expenseBtn").onclick=()=>openAmount("expense");
document.getElementById("incomeBtn").onclick=()=>openAmount("income");
document.getElementById("customBtn").onclick=()=>openAmount("expense");
document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>document.getElementById("amountInput").value=b.dataset.quick);
document.getElementById("amountCancel").onclick=()=>document.getElementById("amountDialog").close();
document.getElementById("amountOK").onclick=()=>{
  const n=Number(document.getElementById("amountInput").value);
  if(n>0){add(window.amountType,n,window.amountType==="income"?"臨時収入":"支出");document.getElementById("amountDialog").close()}
};

/* レシート：label + file input + capture=environment。iPhoneのSafariではタップ時にカメラ/写真選択を起動。 */
document.getElementById("receiptFile").addEventListener("change",async function(){
  const file=this.files&&this.files[0]; if(!file)return;
  const url=URL.createObjectURL(file), preview=document.getElementById("receiptPreview");
  preview.src=url;preview.style.display="block";
  document.getElementById("ocrDialog").showModal();
  const status=document.getElementById("ocrStatus"), amount=document.getElementById("ocrAmount");
  status.textContent="レシートを読み取っています…";
  amount.value="";
  try{
    if(!window.Tesseract)throw new Error("OCR library unavailable");
    const result=await Tesseract.recognize(file,"jpn+eng",{logger:m=>{if(m.status==="recognizing text")status.textContent="文字を読み取り中… "+Math.round((m.progress||0)*100)+"%"}});
    const text=result.data.text.replace(/,/g,"");
    const nums=[...text.matchAll(/(?:¥|￥)?\s*(\d{2,7})\s*円?/g)].map(m=>Number(m[1])).filter(n=>n>=10&&n<=9999999);
    const total=nums.length?Math.max(...nums):0;
    amount.value=total||"";
    status.textContent=total?"読み取りました。金額を確認・修正してから登録してください。":"金額を自動判定できませんでした。金額を入力してください。";
  }catch(e){
    status.textContent="読み取りに失敗しました。金額を入力してください。";
  }
});
document.getElementById("ocrCancel").onclick=()=>{document.getElementById("ocrDialog").close();document.getElementById("receiptFile").value=""};
document.getElementById("ocrOK").onclick=()=>{
  const n=Number(document.getElementById("ocrAmount").value);
  if(n>0){add("expense",n,"レシート");document.getElementById("ocrDialog").close();document.getElementById("receiptFile").value=""}
};

/* 初期状態 */
(function seed(){
  const now=new Date(),cs=cycleStart(now),ce=cycleEnd(cs);
  if(data.logs.length===0 && Object.keys(data.openingBalanceByCycle).length===0){
    data.openingBalanceByCycle[key(cs)]=DEFAULT_REMAIN;
    data.allowanceByCycle[key(new Date(ce.getFullYear(),ce.getMonth()+1,ce.getDate()))]=DEFAULT_NEXT;
    save();
  }
})();
calc();
</script>
</body>
</html>
