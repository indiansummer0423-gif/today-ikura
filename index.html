<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>今日いくら？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:18px 16px 40px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:24px;margin:0}.icon{border:0;background:white;border-radius:14px;font-size:22px;width:44px;height:44px}
.card{background:#fff;border-radius:22px;padding:24px 20px;margin-bottom:14px;box-shadow:0 2px 12px #0000000a}
.label{text-align:center;color:#666;font-size:15px}.today{text-align:center;font-size:48px;font-weight:700;margin:8px 0 14px;letter-spacing:-1px}
.alert{display:none;text-align:center;color:#d00;font-weight:700;line-height:1.5;margin-top:8px}
.notice{display:none;text-align:center;color:#666;font-size:13px;line-height:1.5}
.tomorrow{text-align:center;font-size:16px;color:#555;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;text-align:center}.stat b{display:block;font-size:25px;margin-top:6px}.stat span{color:#666;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{padding:15px 8px;border:0;border-radius:16px;background:#222;color:#fff;font-size:16px}.actions .secondary{background:#fff;color:#222;border:1px solid #ddd}
h2{font-size:16px;margin:4px 0 12px}.history{font-size:14px;color:#555}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.income{color:#147a37}.expense{color:#b00020}
dialog{border:0;border-radius:22px;width:min(92%,480px);padding:0;box-shadow:0 10px 50px #0003}dialog::backdrop{background:#0006}.modal{padding:22px}.modal h2{font-size:20px;margin:0 0 18px}.field{margin:14px 0}.field label{display:block;font-size:13px;color:#666;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px}.modalButtons{display:flex;gap:8px;margin-top:20px}.modalButtons button{flex:1;padding:12px;border:0;border-radius:12px;font-size:15px}.primary{background:#222;color:white}.danger{background:#c00;color:white}.resetArea{margin-top:24px;padding-top:18px;border-top:1px solid #eee}.resetTitle{font-size:13px;color:#999;margin-bottom:8px}.resetButton{width:100%;padding:12px;border:1px solid #d00;color:#d00;background:#fff;border-radius:12px;font-size:15px}
small{color:#888}
</style>
</head>
<body>
<div class="app">
 <div class="header"><h1>今日いくら？</h1><button class="icon" id="settingsBtn">⚙️</button></div>
 <div class="card">
  <div class="label">今日使える金額</div>
  <div class="today" id="today">¥0</div>
  <div class="alert" id="alert"></div>
  <div class="notice" id="notice"></div>
  <div class="tomorrow" id="tomorrow"></div>
 </div>
 <div class="card stats">
  <div class="stat"><span>今月の残り</span><b id="remain">¥0</b></div>
  <div class="stat"><span>今月の使用額</span><b id="spent">¥0</b></div>
 </div>
 <div class="actions">
  <button id="expenseBtn">− 支出</button>
  <button id="incomeBtn">＋ 臨時収入</button>
  <button class="secondary" id="customBtn">− 金額を入力</button>
  <button class="secondary" id="receiptBtn">🧾 レシート</button>
 </div>
 <div class="card"><h2>今日の履歴</h2><div class="history" id="history"></div></div>
</div>

<dialog id="settingsDialog"><div class="modal">
 <h2>設定</h2>
 <div class="field"><label>次回のお小遣い</label><input id="nextAllowance" type="number" min="0" step="100" placeholder="例：39000"></div>
 <div class="field"><label>お小遣い開始日</label><input id="startDay" type="number" min="1" max="28"></div>
 <div class="field"><label>月末の残り</label><select id="carryover"><option value="carry">次月へ繰り越す</option><option value="save">貯金として残す</option><option value="reset">リセットする</option></select></div>
 <div class="modalButtons"><button id="settingsCancel">キャンセル</button><button class="primary" id="settingsSave">保存</button></div>
 <div class="resetArea"><div class="resetTitle">危険な操作</div><button class="resetButton" id="resetBtn">⚠️ データをリセット</button></div>
</div></dialog>

<dialog id="resetDialog"><div class="modal">
 <h2>リセットしてもよろしいですか？</h2><p>支出・臨時収入・設定など、アプリ内の保存データを初期化します。</p>
 <div class="modalButtons"><button id="resetCancel">キャンセル</button><button class="danger" id="resetConfirm">リセット</button></div>
</div></dialog>

<dialog id="amountDialog"><div class="modal">
 <h2 id="amountTitle">支出</h2><div class="field"><label>金額</label><input id="amountInput" type="number" min="1" inputmode="numeric" placeholder="500"></div>
 <div class="modalButtons"><button id="amountCancel">キャンセル</button><button class="primary" id="amountOK">登録</button></div>
</div></dialog>

<script>
const KEY="todayIkura_v16";
const initial={
  startDay:1,
  carryoverMode:"carry",
  allowanceByCycle:{},
  openingBalanceByCycle:{},
  logs:[],
  dailyBudgetByDate:{},
  nextAllowancePrompted:false
};
let data=load();
let amountType="expense";

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"null");
    if(x) return Object.assign({},initial,x);
  }catch(e){}
  return JSON.parse(JSON.stringify(initial));
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function yen(n){return (n<0?"−":"")+"¥"+Math.abs(Math.floor(n)).toLocaleString("ja-JP")}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cycleStart(d){
  const day=Math.min(Math.max(1,data.startDay),28);
  if(d.getDate()>=day) return new Date(d.getFullYear(),d.getMonth(),day,0,0,0,0);
  return new Date(d.getFullYear(),d.getMonth()-1,day,0,0,0,0);
}
function cycleKey(d){return dateKey(d)}
function nextCycle(s){return new Date(s.getFullYear(),s.getMonth()+1,Math.min(data.startDay,28))}
function daysBetween(a,b){return Math.max(1,Math.round((b-a)/86400000))}
function logsIn(s,e){return data.logs.filter(x=>{const d=new Date(x.date);return d>=s&&d<e})}
function cycleAllowance(s){
  const key=cycleKey(s);
  if(Number.isFinite(data.openingBalanceByCycle[key])) return data.openingBalanceByCycle[key];
  const base=Number(data.allowanceByCycle[key]);
  const own=Number.isFinite(base)?base:25000;
  if(data.carryoverMode!=="carry") return own;

  const prev=new Date(s.getFullYear(),s.getMonth()-1,s.getDate());
  const prevKey=cycleKey(prev);
  const prevBase=Number(data.allowanceByCycle[prevKey]);
  const prevOpening=Number(data.openingBalanceByCycle[prevKey]);
  if(!Number.isFinite(prevBase) && !Number.isFinite(prevOpening)) return own;
  const prevAllowance=Number.isFinite(prevOpening)?prevOpening:(Number.isFinite(prevBase)?prevBase:25000);
  const prevEnd=nextCycle(prev);
  const prevLogs=logsIn(prev,prevEnd);
  const prevSpent=prevLogs.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0);
  const prevIncome=prevLogs.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0);
  const prevRemain=Math.max(0,prevAllowance+prevIncome-prevSpent);
  return own+prevRemain;
}
function currentInfo(){
  const now=new Date(), s=cycleStart(now), e=nextCycle(s);
  const ls=logsIn(s,e);
  const spent=ls.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0);
  const income=ls.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0);
  const allowance=cycleAllowance(s);
  return {now,s,e,spent,income,remain:allowance+income-spent,allowance};
}
function calc(){
  const q=currentInfo(), now=q.now, todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()), tomorrowStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const todayLogs=logsIn(todayStart,tomorrowStart);
  const todaySpent=todayLogs.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0);
  const todayIncome=todayLogs.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0);

  let daily=Number(data.dailyBudgetByDate[dateKey(now)]);
  if(!Number.isFinite(daily)){
    const days=daysBetween(todayStart,q.e);
    daily=Math.floor(Math.max(0,q.remain)/days);
    data.dailyBudgetByDate[dateKey(now)]=daily; save();
  }
  const todayRemaining=daily-todaySpent+todayIncome;
  const tomorrowDays=daysBetween(tomorrowStart,q.e);
  const tomorrowDaily=Math.floor(Math.max(0,q.remain)/tomorrowDays);

  document.getElementById("today").textContent=yen(todayRemaining);
  document.getElementById("remain").textContent=yen(q.remain);
  document.getElementById("spent").textContent=yen(q.spent);
  document.getElementById("tomorrow").textContent="明日は "+yen(tomorrowDaily)+" の予定";
  const alert=document.getElementById("alert");
  if(todayRemaining<0){
    alert.style.display="block";
    alert.textContent="使いすぎです。明日以降は1日 "+yen(tomorrowDaily)+" になります。";
  }else alert.style.display="none";

  const next=nextCycle(q.s), nk=cycleKey(next), nextAmt=data.allowanceByCycle[nk];
  const notice=document.getElementById("notice");
  if(nextAmt!=null){
    notice.style.display="block";
    notice.textContent=(next.getMonth()+1)+"月のお小遣い："+yen(nextAmt);
  }else notice.style.display="none";
  renderHistory(todayLogs);
}
function renderHistory(ls){
  const el=document.getElementById("history");
  if(!ls.length){el.innerHTML="<small>まだありません</small>";return}
  el.innerHTML=ls.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(x=>{
    const cls=x.type==="income"?"income":"expense", sign=x.type==="income"?"+":"−";
    return '<div class="row"><span>'+escapeHtml(x.label)+'</span><span class="'+cls+'">'+sign+yen(x.amount)+'</span></div>';
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(type,amount,label){
  amount=Math.floor(Number(amount));
  if(!Number.isFinite(amount)||amount<=0)return;
  data.logs.push({type,amount,label:label|| (type==="income"?"臨時収入":"支出"),date:new Date().toISOString()});
  save();calc();
}
function openAmount(type){amountType=type;document.getElementById("amountTitle").textContent=type==="expense"?"支出":"臨時収入";document.getElementById("amountInput").value="";document.getElementById("amountDialog").showModal();document.getElementById("amountInput").focus()}
function saveSettings(){
  const amount=Number(document.getElementById("nextAllowance").value);
  const start=Number(document.getElementById("startDay").value);
  if(!Number.isInteger(start)||start<1||start>28){alert("開始日は1〜28で入力してください。");return}
  const oldStart=data.startDay;
  const oldCurrent=new Date();
  const oldS=new Date(oldCurrent.getFullYear(),oldCurrent.getMonth(),Math.min(oldStart,28));
  const newS=new Date(oldCurrent.getFullYear(),oldCurrent.getMonth(),Math.min(start,28));
  const nk=cycleKey(new Date(newS.getFullYear(),newS.getMonth()+1,newS.getDate()));
  if(Number.isFinite(amount)&&amount>=0)data.allowanceByCycle[nk]=amount;
  data.startDay=start;
  data.carryoverMode=document.getElementById("carryover").value;
  save();document.getElementById("settingsDialog").close();calc();
}
function openSettings(){
  const q=currentInfo(), next=nextCycle(q.s), nk=cycleKey(next);
  const v=data.allowanceByCycle[nk];
  document.getElementById("nextAllowance").value=v==null?"":v;
  document.getElementById("startDay").value=data.startDay;
  document.getElementById("carryover").value=data.carryoverMode;
  document.getElementById("settingsDialog").showModal();
}
function resetAll(){
  localStorage.removeItem(KEY);
  data=load();
  const now=new Date(), s=cycleStart(now), nk=cycleKey(nextCycle(s));
  data.openingBalanceByCycle[cycleKey(s)]=17664;
  data.allowanceByCycle[nk]=39000;
  save();
  document.getElementById("resetDialog").close();
  document.getElementById("settingsDialog").close();
  calc();
}
document.getElementById("settingsBtn").onclick=openSettings;
document.getElementById("settingsCancel").onclick=()=>document.getElementById("settingsDialog").close();
document.getElementById("settingsSave").onclick=saveSettings;
document.getElementById("resetBtn").onclick=()=>document.getElementById("resetDialog").showModal();
document.getElementById("resetCancel").onclick=()=>document.getElementById("resetDialog").close();
document.getElementById("resetConfirm").onclick=resetAll;
document.getElementById("expenseBtn").onclick=()=>openAmount("expense");
document.getElementById("incomeBtn").onclick=()=>openAmount("income");
document.getElementById("customBtn").onclick=()=>openAmount("expense");
document.getElementById("amountCancel").onclick=()=>document.getElementById("amountDialog").close();
document.getElementById("amountOK").onclick=()=>{
 const v=document.getElementById("amountInput").value;
 if(Number(v)>0){add(amountType,v,amountType==="expense"?"支出":"臨時収入");document.getElementById("amountDialog").close()}
};

// 初期状態：現在サイクル残高17,664円、次回39,000円。
// 既存v2〜v15のデータは自動移行せず、v16として安全に独立管理。
(function seed(){
 const now=new Date(), s=cycleStart(now), nk=cycleKey(nextCycle(s));
 if(!Number.isFinite(data.openingBalanceByCycle[cycleKey(s)]) && data.logs.length===0){
   data.openingBalanceByCycle[cycleKey(s)]=17664;
 }
 if(data.allowanceByCycle[nk]==null && data.logs.length===0)data.allowanceByCycle[nk]=39000;
 save();
})();
calc();
</script>
</body>
</html>
