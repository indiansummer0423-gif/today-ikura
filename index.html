const OLD_KEYS=['majide-kekkyoku-v12','majide-kekkyoku-v11','majide-kekkyoku-v10','majide-kekkyoku-v9','majide-kekkyoku-v8','majide-kekkyoku-v7','majide-kekkyoku-v6','majide-kekkyoku-v5','majide-kekkyoku-v4','majide-kekkyoku-v3','majide-kekkyoku-v1'];
const yen=n=>new Intl.NumberFormat('ja-JP').format(Math.round(Number(n)||0));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthKey=()=>today().slice(0,7);
const daysInMonth=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const daysLeft=()=>daysInMonth()-new Date().getDate()+1;
const clamp0=n=>Math.max(0,Number(n)||0);
function fresh(){return {version:22,monthKey:monthKey(),budget:{necessary:23000,payNecessary:10000},balance:{cash:5000,paypay:34000},necessaryRemain:{cash:13000,paypay:10000},daily:{date:today(),total:null,cash:null,paypay:null},events:[],monthSetupNeeded:false,pendingBudget:null}}
function oldNecessaryRemains(o){
  const budget=o?.budget||{};
  const necessary=Number(budget.necessary??o?.necessary??23000)||0;
  const payNecessary=Number(budget.payNecessary??o?.payNecessary??10000)||0;
  const spent=o?.spent||{};
  const adjust=o?.adjust||{};
  const spentCash=Number(spent.necCash)||0;
  const spentPay=Number(spent.necPay)||0;
  const adjTotal=Number(adjust.necTotal??o?.necAdjustTotal)||0;
  const adjPay=Number(adjust.necPay??o?.necAdjustPay)||0;
  const pay=payNecessary-spentPay+adjPay;
  const cash=necessary-spentCash-spentPay+adjTotal-pay;
  return {cash,paypay:pay};
}
function migrate(o){
  const n=fresh();
  if(!o||typeof o!=='object')return n;
  n.monthKey=o.monthKey||monthKey();
  n.budget.necessary=clamp0(o.budget?.necessary??o.necessary??23000);
  n.budget.payNecessary=clamp0(o.budget?.payNecessary??o.payNecessary??10000);
  n.balance.cash=Number(o.balance?.cash??o.cash)||0;
  n.balance.paypay=Number(o.balance?.paypay??o.paypay)||0;
  n.events=Array.isArray(o.events)?o.events.slice():[];
  if(o.necessaryRemain){
    n.necessaryRemain.cash=Number(o.necessaryRemain.cash)||0;
    n.necessaryRemain.paypay=Number(o.necessaryRemain.paypay)||0;
  }else{
    n.necessaryRemain=oldNecessaryRemains(o);
  }
  n.daily={date:today(),total:null,cash:null,paypay:null};
  if(n.monthKey!==monthKey()){
    n.monthSetupNeeded=true;
    n.pendingBudget={...n.budget};
  }
  return n;
}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return normalize(JSON.parse(raw));for(const k of OLD_KEYS){const old=localStorage.getItem(k);if(old){const n=migrate(JSON.parse(old));localStorage.setItem(KEY,JSON.stringify(n));return n}}}catch(e){}return fresh()}
function normalize(x){const n=fresh();Object.assign(n,x||{});n.version=22;n.budget=Object.assign(fresh().budget,x?.budget||{});delete n.budget.allowance;n.balance=Object.assign(fresh().balance,x?.balance||{});n.necessaryRemain=Object.assign(fresh().necessaryRemain,x?.necessaryRemain||{});n.daily=Object.assign(fresh().daily,x?.daily||{});n.events=Array.isArray(x?.events)?x.events:[];if(!x?.necessaryRemain){const r=oldNecessaryRemains(x);n.necessaryRemain=r}return n}
let s=load(),purpose='allowance',method='cash',entryAmount='',moveFrom='allowance-cash',moveTo='allowance-paypay',editingIndex=null;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function resetDay(){if(s.daily.date!==today()){s.daily={date:today(),total:null,cash:null,paypay:null};save()}}
function necPayRemain(){return Number(s.necessaryRemain.paypay)||0}
function necCashRemain(){return Number(s.necessaryRemain.cash)||0}
function reservedCash(){return Math.max(0,necCashRemain())}
function reservedPaypay(){return Math.max(0,necPayRemain())}
function freeCash(){return Math.max(0,s.balance.cash-reservedCash())}
function freePaypay(){return Math.max(0,s.balance.paypay-reservedPaypay())}
function freeTotal(){return freeCash()+freePaypay()}
function todayAllowanceSpentTotal(){return todayAllowanceSpent('cash')+todayAllowanceSpent('paypay')}
function bucketLabel(k){return {'allowance-cash':'現金・小遣い','allowance-paypay':'PayPay・小遣い','necessary-cash':'現金・必要経費','necessary-paypay':'PayPay・必要経費'}[k]||k}
function bucketAmount(k){if(k==='allowance-cash')return freeCash();if(k==='allowance-paypay')return freePaypay();if(k==='necessary-cash')return Math.max(0,necCashRemain());if(k==='necessary-paypay')return Math.max(0,necPayRemain());return 0}
function bucketMethod(k){return k.endsWith('-paypay')?'paypay':'cash'}
function bucketPurpose(k){return k.startsWith('necessary')?'necessary':'allowance'}
function todayAllowanceSpent(m){return s.events.filter(e=>e.date===today()&&e.type==='支出'&&e.purpose==='allowance'&&e.method===m).reduce((a,e)=>a+Number(e.amount||0),0)}
function calculateDailyBase(){const r=daysLeft(),total=freeTotal();if(r<=0)return {baseTotal:total,c:total,p:0};const baseTotal=Math.floor(total/r),sum=freeCash()+freePaypay();let c=sum?Math.floor(baseTotal*freeCash()/sum):0;let p=baseTotal-c;c=Math.min(c,freeCash());p=Math.min(p,freePaypay());let rem=baseTotal-c-p;if(rem>0){const payRoom=freePaypay()-p,cashRoom=freeCash()-c;if(payRoom>=cashRoom)p+=Math.min(rem,payRoom);else c+=Math.min(rem,cashRoom)}return {baseTotal,c,p}}
function ensureDaily(){resetDay();if(s.daily.total!==null)return;const b=calculateDailyBase();s.daily={date:today(),total:b.baseTotal,cash:b.c,paypay:b.p};save()}
function daily(){ensureDaily();const sc=todayAllowanceSpent('cash'),sp=todayAllowanceSpent('paypay');return {total:s.daily.total-sc-sp,cash:s.daily.cash-sc,paypay:s.daily.paypay-sp}}
function reallocateDaily(){s.daily={date:today(),total:null,cash:null,paypay:null};ensureDaily()}
function tomorrowDaily(){const r=daysLeft()-1;return r>0?Math.floor(freeTotal()/r):0}
function monthReady(){if(s.monthKey===monthKey()&&!s.monthSetupNeeded)return true;if(s.monthKey!==monthKey()&&!s.monthSetupNeeded){s.monthSetupNeeded=true;s.pendingBudget={...s.budget};save()}renderMonthSetup();return false}
function renderMonthSetup(){const m=new Date().getMonth()+1,b=s.pendingBudget||s.budget;document.getElementById('home').classList.add('active');document.getElementById('home').innerHTML=`<div class="card"><div class="section">${m}月の設定</div><div class="help">新しい月です。必要経費として確保する金額を確認してください。変更がなければ、そのまま開始できます。</div><div class="setting"><span>必要経費 合計</span><input id="newN" type="number" min="0" value="${b.necessary}"></div><div class="setting"><span>PayPay必要経費</span><input id="newP" type="number" min="0" value="${b.payNecessary}"></div><div class="help">小遣い予算はありません。実際に残っている小遣いを、そのまま自由に使えるお金として管理します。</div><button class="primary" onclick="startMonth()">${m}月を開始する</button></div>`;document.getElementById('ht').textContent='まじで結局どーなん？';document.getElementById('hd').textContent='今月の設定が必要です';}
function startMonth(){const n=clamp0(document.getElementById('newN').value),p=clamp0(document.getElementById('newP').value);if(p>n){toast('PayPay必要経費は必要経費合計を超えられません');return}s.monthKey=monthKey();s.budget={necessary:n,payNecessary:p};s.necessaryRemain={cash:n-p,paypay:p};s.daily={date:today(),total:null,cash:null,paypay:null};s.monthSetupNeeded=false;s.pendingBudget=null;save();home()}
function show(id){if(id!=='home'&&!monthReady())return;['home','expense','income','transfer','settings','history'].forEach(x=>document.getElementById(x).classList.remove('active'));document.getElementById(id).classList.add('active');['nh','nr','ns'].forEach(x=>document.getElementById(x).classList.remove('on'));const nav={home:'nh',history:'nr',settings:'ns'}[id];if(nav)document.getElementById(nav).classList.add('on');if(id==='home')home();if(id==='expense')entry('expense');if(id==='income')entry('income');if(id==='transfer')transferForm();if(id==='settings')settings();if(id==='history')history()}
function openSettings(){show('settings')}

function appIcon(type,cls="appIcon"){return `<img class="${cls}" src="${APP_ICONS[type]}" alt="">`}
function methodIcon(method,cls="appIcon"){return appIcon(method==='paypay'?'paypay':'cash',cls)}

function home(){if(!monthReady())return;resetDay();const d=daily(),f=freeTotal(),totalMoney=(Number(s.balance.cash)||0)+(Number(s.balance.paypay)||0),sum=freeCash()+freePaypay();let dc=0,dp=0;if(sum>0&&f>0){dc=Math.min(freeCash(),Math.round(f*freeCash()/sum));dp=f-dc;if(dp>freePaypay()){dp=freePaypay();dc=f-dp}if(dc>freeCash()){dc=freeCash();dp=f-dc}}const tomorrow=tomorrowDaily();document.getElementById('home').innerHTML=`<div class="card"><div class="kRow"><div class="k">本当に自由に使えるお金</div><div class="sideValue">総額 ¥${yen(totalMoney)}</div></div><div class="big">¥${yen(f)}</div><div class="grid2"><div class="mini"><label>${methodIcon('cash')}現金</label><b class="cash">¥${yen(dc)}</b></div><div class="mini"><label>${methodIcon('paypay')}PayPay</label><b class="pay">¥${yen(dp)}</b></div></div></div><div class="card today"><div class="kRow"><div class="k">今日使える金額</div><div class="sideValue">明日は¥${yen(tomorrow)}使える予定</div></div><div class="big">¥${yen(d.total)}</div><div class="grid2"><div class="mini"><label>${methodIcon('cash')}現金</label><b class="cash">¥${yen(d.cash)}</b></div><div class="mini"><label>${methodIcon('paypay')}PayPay</label><b class="pay">¥${yen(d.paypay)}</b></div></div><div class="todaySpent">今日使った小遣い <b>¥${yen(todayAllowanceSpentTotal())}</b></div>${d.total<0?`<div class="alert">使いすぎです。明日以降は1日 ¥${yen(tomorrow)} になります。</div>`:''}</div><div class="actions"><button class="action allow" onclick="openEntry('expense','allowance')">${appIcon('allowance','appIcon')}小遣いで使う<small>自由な支出</small></button><button class="action nec" onclick="openEntry('expense','necessary')">${appIcon('necessary','appIcon')}必要経費で使う<small>昼食・子ども関係など</small></button></div><div class="actions"><button class="action income" onclick="openEntry('income')">＋ 臨時収入<small>小遣い or 必要経費</small></button><button class="action transfer" onclick="openTransfer()">↔ お金を移動<small>袋から袋へ移す</small></button></div><div class="card"><div class="section">必要経費の確保</div><div class="grid2"><div class="mini"><label>現金に残す分</label><b class="${necCashRemain()<0?'negative':'cash'}">${necCashRemain()<0?'−':''}¥${yen(Math.abs(necCashRemain()))}</b></div><div class="mini"><label>PayPayに残す分</label><b class="${necPayRemain()<0?'negative':'pay'}">${necPayRemain()<0?'−':''}¥${yen(Math.abs(necPayRemain()))}</b></div></div>${necCashRemain()<0||necPayRemain()<0?`<div class="alert">${necessaryDeficitText()}</div>`:''}</div>`;document.getElementById('ht').textContent='まじで結局どーなん？';document.getElementById('hd').textContent=`${new Date().getMonth()+1}月${new Date().getDate()}日・残り${daysLeft()}日`}
function necessaryDeficitText(){const a=[],c=necCashRemain(),p=necPayRemain();if(c<0)a.push('現金の必要経費が¥'+yen(Math.abs(c))+'不足');if(p<0)a.push('PayPayの必要経費が¥'+yen(Math.abs(p))+'不足');return a.join('、')+'しています。'}
function openEntry(k,p){purpose=k==='income'?'allowance':(p||'allowance');method='cash';entryAmount='';show(k)}
function entry(k){const inc=k==='income';const canSim=!inc&&purpose==='allowance';const editing=editingIndex!==null;document.getElementById('ht').textContent=editing?(inc?'臨時収入を修正':'支出を修正'):(inc?'臨時収入':'支出');document.getElementById('hd').textContent=editing?'今日の履歴を修正しています':(inc?'入ってきたお金を分類して登録':(purpose==='allowance'?'小遣いとして使ったお金':'必要経費として使ったお金'));const purposeEdit=editing&&!inc;document.getElementById(k).innerHTML=`<div class="card entryScreenCard ${inc?'incomeEntry':(purpose==='allowance'?'allowanceEntry':'necessaryEntry')}">${(inc||purposeEdit)?`<div class="section">何のお金？</div><div class="opts purposeOpts"><button type="button" class="opt purposeOpt ${purpose==='allowance'?'allowSel':'allowChoice'}" onclick="selectPurpose('${k}','allowance')">${purposeIcon('allowance','appIcon')}<span class="optLabel">小遣い</span></button><button type="button" class="opt purposeOpt ${purpose==='necessary'?'necSel':'necChoice'}" onclick="selectPurpose('${k}','necessary')">${purposeIcon('necessary','appIcon')}<span class="optLabel">必要経費</span></button></div>`:''}<div class="formlabel">${inc?'どこに入った？':'どこから払った？'}</div><div class="opts"><button class="opt ${method==='cash'?'cashSel':'cashChoice'}" onclick="selectMethod('${k}','cash')">${methodIcon('cash','appIcon')}現金</button><button class="opt ${method==='paypay'?'paySel':'payChoice'}" onclick="selectMethod('${k}','paypay')">${methodIcon('paypay','appIcon')}PayPay</button></div><div class="formlabel">金額</div><input id="${k}amt" class="amount" type="text" inputmode="none" readonly placeholder="0" value="${entryAmount}" onclick="openKeypad('${k}amt','${inc?'income':'expense'}')">${editing?`<button class="primary" onclick="saveHistoryEdit()">変更を保存</button>`:(inc?`<button class="primary" onclick="register('${k}')">＋ 登録する</button>`:`<button class="primary" onclick="register('${k}')">− 登録する</button>${canSim?`<button class="secondary" onclick="simulateExpense()">試算</button><div id="simulationResult"></div>`:''}`)}<button class="secondary" onclick="cancelEntry()">キャンセル</button><div class="help">${editing?'変更内容を保存すると、今日の残高・今日使った小遣い・今日使える金額を再計算します。':(inc?'①目的 → ②現金/PayPay → ③金額 → ④保存。':(canSim?'①現金/PayPay → ②金額 → ③試算または保存。':'①現金/PayPay → ②金額 → ③保存。'))}</div></div>`;const input=document.getElementById(k+'amt');input.addEventListener('input',()=>entryAmount=input.value)}
function selectPurpose(k,p){const input=document.getElementById(k+'amt');if(input)entryAmount=input.value;purpose=p;entry(k)}
function selectMethod(k,m){const input=document.getElementById(k+'amt');if(input)entryAmount=input.value;method=m;entry(k)}
let keypadTarget=null,keypadMode='number',keypadValue='',calcExpr='',calcResult=null;
function openKeypad(targetId,title){
  keypadTarget=document.getElementById(targetId);if(!keypadTarget)return;
  keypadValue=String(keypadTarget.value||entryAmount||'');calcExpr='';calcResult=null;keypadMode='number';
  document.getElementById('kpTitle').textContent='金額を入力';
  document.getElementById('keypadModal').style.display='flex';renderKeypad();
}
function closeKeypad(){document.getElementById('keypadModal').style.display='none';keypadTarget=null}
function renderKeypad(){
  const d=document.getElementById('kpDisplay'),sub=document.getElementById('kpSub'),keys=document.getElementById('kpKeys'),hint=document.getElementById('kpHint');
  if(keypadMode==='number'){
    d.textContent='¥'+(keypadValue?yen(keypadValue):'0');sub.textContent='';
    keys.className='kpGrid';keys.innerHTML=`<button class="kpKey" onclick="kpDigit('1')">1</button><button class="kpKey" onclick="kpDigit('2')">2</button><button class="kpKey" onclick="kpDigit('3')">3</button><button class="kpKey" onclick="kpDigit('4')">4</button><button class="kpKey" onclick="kpDigit('5')">5</button><button class="kpKey" onclick="kpDigit('6')">6</button><button class="kpKey" onclick="kpDigit('7')">7</button><button class="kpKey" onclick="kpDigit('8')">8</button><button class="kpKey" onclick="kpDigit('9')">9</button><button class="kpKey op" onclick="kpClear()">C</button><button class="kpKey" onclick="kpDigit('0')">0</button><button class="kpKey op" onclick="kpBackspace()">⌫</button><button class="kpKey calcMode" onclick="openCalculator()">電卓</button><button class="kpKey ok" onclick="kpCommit()">OK</button><span></span>`;
    hint.textContent='数字を入力して「OK」で反映';
    return;

function evaluateCalc(expr){
  if(!/^(?:\d+(?:\.\d*)?|\.\d|[+\-*/])+$/.test(expr)||/[+\-*/.]$/.test(expr))return null;
  const tokens=expr.match(/\d+(?:\.\d*)?|\.\d+|[+\-*/]/g)||[],vals=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2};
  const apply=()=>{const op=ops.pop(),b=vals.pop(),a=vals.pop();if(a===undefined||b===undefined)return false;if(op==='+')vals.push(a+b);else if(op==='-')vals.push(a-b);else if(op==='*')vals.push(a*b);else vals.push(a/b);return Number.isFinite(vals[vals.length-1])};
  for(const t of tokens){if(/^\d|^\./.test(t)){vals.push(Number(t));}else{while(ops.length&&prec[ops[ops.length-1]]>=prec[t]){if(!apply())return null}ops.push(t)}}
  while(ops.length){if(!apply())return null}
  return vals.length===1&&Number.isFinite(vals[0])?vals[0]:null;
}
function calcEquals(){if(!calcExpr)return;const r=evaluateCalc(calcExpr);if(r===null){toast('計算式を確認してください');return}calcResult=r;renderKeypad()}

function simulateExpense(){
  const input=document.getElementById('expenseamt'),n=Math.floor(Number(input?.value));
  if(!Number.isFinite(n)||n<=0){toast('金額を入力してください');return}
  if(purpose!=='allowance')return;

  // 試算の可否は「今日の配分」ではなく、選択した袋の
  // 「本当に自由に使える残高」で判定する。
  const freeBefore=method==='cash'?freeCash():freePaypay();
  if(n>freeBefore){showShortageModal('allowance',method,n);return}

  // 試算結果の左側は「今日使える金額」ではなく、
  // 選択した袋（現金/PayPay）の「本当に自由に使える残高」から
  // 試算額を引いた残りを表示する。
  // 例：自由に使える現金127円で127円を試算 → 現金の残り0円。
  const methodLabel=method==='cash'?'現金の残り':'PayPayの残り';
  const methodRemaining=freeBefore-n;

  // 明日以降は、選択した袋の自由残高から試算額を差し引いた
  // 仮想状態を使って、現在と同じ日割りロジックで再計算する。
  const original=s;
  try{
    const simulated=JSON.parse(JSON.stringify(s));
    if(method==='cash')simulated.balance.cash=Number(simulated.balance.cash||0)-n;
    else simulated.balance.paypay=Number(simulated.balance.paypay||0)-n;
    simulated.events=Array.isArray(simulated.events)?simulated.events.slice():[];
    simulated.events.push({date:today(),type:'支出',purpose:'allowance',method,amount:n});
    s=simulated;

    const r=daysLeft()-1;
    const tomorrow=r>0?Math.floor(freeTotal()/r):freeTotal();
    const el=document.getElementById('simulationResult');
    if(el)el.innerHTML=`<div class="simulate"><div class="simulateTitle">試算結果</div><div class="simulateGrid"><div class="simulateBox"><label>${methodLabel}</label><b>${methodRemaining<0?'−¥'+yen(Math.abs(methodRemaining)):'¥'+yen(methodRemaining)}</b></div><div class="simulateBox"><label>明日から（予想）</label><b>¥${yen(tomorrow)} / 日</b></div></div><div class="simulateNote">この結果は試算です。残高・履歴には反映されません。</div></div>`;
  }finally{
    s=original;
  }
}

function revertEvent(e){
  const n=Number(e.amount)||0;
  if(e.type==='支出'){
    if(e.purpose==='allowance'){
      if(e.method==='cash')s.balance.cash+=n;else s.balance.paypay+=n;
    }else{
      if(e.method==='cash'){s.balance.cash+=n;s.necessaryRemain.cash+=n}else{s.balance.paypay+=n;s.necessaryRemain.paypay+=n}
    }
  }else if(e.type==='収入'){
    if(e.method==='cash')s.balance.cash-=n;else s.balance.paypay-=n;
    if(e.purpose==='necessary'){
      if(e.method==='cash')s.necessaryRemain.cash-=n;else s.necessaryRemain.paypay-=n;
    }
  }else if(e.type==='移動'){
    const fm=bucketMethod(e.from),tm=bucketMethod(e.to),fp=bucketPurpose(e.from),tp=bucketPurpose(e.to);
    if(fm==='cash'&&tm==='paypay'){s.balance.cash+=n;s.balance.paypay-=n}
    else if(fm==='paypay'&&tm==='cash'){s.balance.paypay+=n;s.balance.cash-=n}
    if(fp==='allowance'&&tp==='necessary'){
      if(tm==='cash')s.necessaryRemain.cash-=n;else s.necessaryRemain.paypay-=n;
    }else if(fp==='necessary'&&tp==='allowance'){
      if(fm==='cash')s.necessaryRemain.cash+=n;else s.necessaryRemain.paypay+=n;
    }else if(fp==='necessary'&&tp==='necessary'&&fm!==tm){
      if(fm==='cash'){s.necessaryRemain.cash+=n;s.necessaryRemain.paypay-=n}
      else{s.necessaryRemain.paypay+=n;s.necessaryRemain.cash-=n}
    }
  }
}

function saveHistoryEdit(){
  if(editingIndex===null)return;
  const idx=editingIndex,old=s.events[idx];
  if(!old||old.date!==today()){cancelHistoryEdit();return}
  let next,n;
  if(old.type==='移動'){
    n=Math.floor(Number(document.getElementById('transferAmt')?.value));
    if(moveFrom===moveTo){toast('移動元と移動先を別にしてください');return}
    if(!Number.isFinite(n)||n<=0){toast('金額を入力してください');return}
    next={date:today(),type:'移動',from:moveFrom,to:moveTo,amount:n};
  }else{
    const k=old.type==='収入'?'income':'expense';
    n=Math.floor(Number(document.getElementById(k+'amt')?.value));
    if(!Number.isFinite(n)||n<=0){toast('金額を入力してください');return}
    next={date:today(),type:old.type,purpose,method,amount:n};
  }

  const snapshot=JSON.parse(JSON.stringify(s));
  try{
    // いったん元の履歴を取り消し、変更後の内容を現在の状態へ適用する。
    revertEvent(old);

    if(next.type==='支出'){
      if(next.purpose==='allowance'){
        const avail=next.method==='cash'?freeCash():freePaypay();
        if(n>avail)throw new Error('不足');
      }else{
        const remain=next.method==='cash'?necCashRemain():necPayRemain();
        const balance=next.method==='cash'?Number(s.balance.cash)||0:Number(s.balance.paypay)||0;
        if(n>remain||n>balance)throw new Error('不足');
      }
    }else if(next.type==='収入'){
      // 収入は金額・目的・受取方法の変更後内容をそのまま適用。
    }else if(next.type==='移動'){
      if(n>bucketAmount(next.from))throw new Error('不足');
    }

    applyEvent(next);
    if(s.balance.cash<0||s.balance.paypay<0)throw new Error('不足');
    s.events[idx]=next;
    reallocateDaily();
    save();

    entryAmount='';
    editingIndex=null;
    toast('変更を保存しました');
    setTimeout(()=>show('home'),250);
  }catch(err){
    s=snapshot;
    toast(err.message==='不足'?'変更後の金額では残高が不足します':'変更を保存できませんでした');
  }
}

    const click=editable?` onclick="startHistoryEdit(${index})" role="button" tabindex="0"`:'';
    const cls=editable?'item historyEditable':'item';
    if(x.type==='移動') return `<div class="${cls}"${click}><div>移動・${bucketLabel(x.from)} → ${bucketLabel(x.to)}<div class="meta">${x.date}${editable?'　タップで修正':''}</div></div><div class="move">↔ ¥${yen(x.amount)}</div></div>`;
    return `<div class="${cls}"${click}><div>${x.type}・${purposeIcon(x.purpose,'historyIcon')}${methodIcon(x.method,'historyIcon')}${x.purpose==='allowance'?'小遣い':'必要経費'}・${x.method==='cash'?'現金':'PayPay'}<div class="meta">${x.date}${editable?'　タップで修正':''}</div></div><div class="${x.type==='収入'?'plus':'minus'}">${x.type==='収入'?'+':'−'}¥${yen(x.amount)}</div></div>`;
  };
  let html=`<div class="card historyCard"><div class="section">履歴</div>`;
  if(!dates.length){html+=`<div class="note">まだ記録はありません。</div>`;}
  else{
    dates.forEach((d,i)=>{
      const isToday=d===todayDate;
      if(isToday){
        html+=`<div class="historyDay todayHistory"><div class="historyDate">今日　${fmt(d)}</div>${groups[d].map(o=>row(o.x,o.index)).join('')}</div>`;
      }else{
        const id='hist_'+d.replace(/-/g,'');
        html+=`<button class="historyDateBtn" onclick="toggleHistoryDate('${id}')"><span>${fmt(d)}</span><span class="historyCount">${groups[d].length}件　›</span></button><div id="${id}" class="historyDay pastHistory">${groups[d].map(o=>row(o.x,o.index)).join('')}</div>`;
      }
    });
  }
  html+=`</div>`;
  document.getElementById('history').innerHTML=html;
}
function toggleHistoryDate(id){const el=document.getElementById(id);if(!el)return;const btn=el.previousElementSibling;el.classList.toggle('open');if(btn)btn.classList.toggle('open')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',1800)}
resetDay();if(s.monthKey!==monthKey()){s.monthKey=monthKey();s.monthSetupNeeded=false;s.pendingBudget=null;s.daily={date:today(),total:null,cash:null,paypay:null};save()}home();
</script>
