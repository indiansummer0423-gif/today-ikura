<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日いくら？">
<title>今日いくら？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px 35px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0}
button{font:inherit}.icon{border:0;background:#fff;border-radius:14px;padding:10px 12px;font-size:20px}
.date{text-align:center;color:#6b7280;font-size:14px;margin-bottom:15px}
.hero{background:#111827;color:#fff;border-radius:28px;padding:30px 18px 25px;text-align:center;box-shadow:0 12px 28px #0002}
.label{font-size:15px;opacity:.75}.amount{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-2px;margin:9px 0}.remainToday{font-size:15px;opacity:.82}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.card{background:#fff;border-radius:18px;padding:16px}.small{font-size:13px;color:#6b7280}.val{font-size:21px;font-weight:750;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:0;background:#fff;border-radius:16px;padding:16px;font-weight:700;box-shadow:0 2px 9px #0000000b}.actions .wide{grid-column:1/-1;background:#e5e7eb}
section{margin-top:22px}h2{font-size:16px;margin:0 0 9px}.box{background:#fff;border-radius:18px;overflow:hidden}.row{display:flex;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee}.row:last-child{border:0}.empty{text-align:center;color:#9ca3af;padding:22px}
.note{text-align:center;color:#9ca3af;font-size:12px;margin-top:18px}
dialog{border:0;border-radius:22px;width:min(92%,420px);padding:22px;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}
label{display:block;color:#6b7280;font-size:13px;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:17px}
.btns{display:flex;gap:10px;margin-top:20px}.btns button{flex:1;padding:13px;border:0;border-radius:12px}.primary{background:#111827;color:#fff}
.danger{color:#b91c1c;background:#fee2e2}
</style>
</head>
<body>
<div class="app">
<header><h1>今日いくら？</h1><button class="icon" onclick="settings.showModal()">⚙️</button></header>
<div id="date" class="date"></div>
<div class="hero">
 <div class="label">今日使える金額</div>
 <div id="today" class="amount">¥0</div>
 <div id="remainToday" class="remainToday"></div>
</div>
<div class="stats">
 <div class="card"><div class="small">今月の残り</div><div id="remain" class="val">¥0</div></div>
 <div class="card"><div class="small">今月の使用額</div><div id="spent" class="val">¥0</div></div>
</div>
<div class="actions">
 <button onclick="add(500)">− ¥500</button><button onclick="add(1000)">− ¥1,000</button>
 <button class="wide" onclick="custom.showModal()">− 金額を入力</button>
</div>
<section><h2>今日の履歴</h2><div id="history" class="box"></div></section>
<div id="carry" class="note"></div>
</div>

<dialog id="settings">
<h2>設定</h2>
<label>月のお小遣い</label><input id="allowance" type="number" min="0" step="100" inputmode="numeric">
<label>毎月の支給日（1〜28日）</label><input id="startDay" type="number" min="1" max="28" inputmode="numeric">
<div class="btns"><button onclick="settings.close()">キャンセル</button><button class="primary" onclick="saveSettings()">保存</button></div>
</dialog>

<dialog id="custom">
<h2>使った金額</h2><label>金額</label><input id="customAmount" type="number" min="1" step="100" inputmode="numeric">
<div class="btns"><button onclick="custom.close()">キャンセル</button><button class="primary" onclick="saveCustom()">追加</button></div>
</dialog>

<script>
const KEY="todayikura_v2";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{allowance:25000,startDay:1,logs:[]};
const yen=n=>"¥"+Math.max(0,Math.round(n)).toLocaleString("ja-JP");
const dayMs=86400000;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function startOfCycle(d=new Date()){
 let y=d.getFullYear(),m=d.getMonth();
 if(d.getDate()<data.startDay)m--;
 return new Date(y,m,data.startDay,0,0,0,0);
}
function endOfCycle(s){return new Date(s.getFullYear(),s.getMonth()+1,data.startDay,0,0,0,0)}
function logsIn(s,e){return data.logs.filter(x=>{let d=new Date(x.date);return d>=s&&d<e})}
function calc(){
 const now=new Date(), s=startOfCycle(now), e=endOfCycle(s);
 const logs=logsIn(s,e);
 const spent=logs.reduce((a,x)=>a+x.amount,0);
 const remain=Math.max(0,data.allowance-spent);
 const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const todayLogs=logs.filter(x=>new Date(x.date)>=todayStart&&new Date(x.date)<new Date(todayStart.getTime()+dayMs));
 const todaySpent=todayLogs.reduce((a,x)=>a+x.amount,0);
 // 「今この瞬間から支給期間終了まで、均等に使うなら今日あといくらか」を表示
 const daysLeft=Math.max(1,Math.ceil((e-now)/dayMs));
 const daily=Math.floor(remain/daysLeft);
 const available=Math.max(0,daily);
 const carry=remain-(daily*daysLeft);
 document.getElementById("date").textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
 document.getElementById("today").textContent=yen(available);
 document.getElementById("remainToday").textContent=`今日すでに ${yen(todaySpent)} 使用`;
 document.getElementById("remain").textContent=yen(remain);
 document.getElementById("spent").textContent=yen(spent);
 document.getElementById("carry").textContent=`支給期間の残り ${daysLeft}日`;
 const h=document.getElementById("history");
 h.innerHTML=todayLogs.length?todayLogs.slice().reverse().map(x=>`<div class="row"><span>${new Date(x.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span><strong>− ${yen(x.amount)}</strong></div>`).join(""):'<div class="empty">今日はまだ使っていません</div>';
}
function add(amount){data.logs.push({amount,date:new Date().toISOString()});save();calc()}
function saveCustom(){let a=Number(document.getElementById("customAmount").value);if(a>0){add(a);document.getElementById("customAmount").value="";custom.close()}}
function saveSettings(){
 data.allowance=Math.max(0,Number(document.getElementById("allowance").value)||0);
 data.startDay=Math.min(28,Math.max(1,Number(document.getElementById("startDay").value)||1));
 save();settings.close();calc();
}
allowance.value=data.allowance;startDay.value=data.startDay;calc();
</script>
</body></html>
